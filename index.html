*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft JhengHei','PingFang TC',sans-serif;background:linear-gradient(160deg,#eaf4ff,#e8f7f1);min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:30px 20px}

.navbtns{display:flex;justify-content:center;gap:14px;margin-top:26px;flex-wrap:wrap}
.navbtn{display:inline-block;background:#4a90c4;color:#fff;text-decoration:none;font-size:15px;font-weight:bold;padding:11px 22px;border-radius:26px;box-shadow:0 3px 0 #356f9c;transition:transform .12s,box-shadow .12s}
.navbtn:hover{transform:translateY(-2px);box-shadow:0 5px 0 #356f9c}
.navbtn.alt{background:#f0a93b;box-shadow:0 3px 0 #c9871f}
.navbtn.alt:hover{box-shadow:0 5px 0 #c9871f}
