<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>發音學習</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft JhengHei','PingFang TC',sans-serif;background:linear-gradient(160deg,#eaf4ff,#e8f7f1);min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:30px 20px}
h1{text-align:center;color:#2f6fa8;font-size:26px;margin-bottom:8px}
.sub{text-align:center;color:#7c93a8;font-size:14px;margin-bottom:26px}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}
.card{width:min(300px,100%);background:#fff;border-radius:18px;text-decoration:none;color:#33475a;box-shadow:0 4px 14px rgba(0,0,0,.08);transition:transform .15s,box-shadow .15s;border:3px solid #e2eef7;overflow:hidden;display:block}
.card:hover{transform:translateY(-5px);box-shadow:0 12px 26px rgba(0,0,0,.16)}
.cover{aspect-ratio:16/9;background:#eef6fc;display:flex;align-items:center;justify-content:center;font-size:48px}
.card .body{padding:13px 14px 16px;text-align:center}
.card .nm{font-size:17px;font-weight:bold;color:#2f4a60}
.card .ds{font-size:12px;color:#93a7b8;margin-top:5px}
.navbtns{display:flex;justify-content:center;gap:14px;margin-top:26px;flex-wrap:wrap}
.navbtn{display:inline-block;background:#4a90c4;color:#fff;text-decoration:none;font-size:15px;font-weight:bold;padding:11px 22px;border-radius:26px;box-shadow:0 3px 0 #356f9c;transition:transform .12s,box-shadow .12s}
.navbtn:hover{transform:translateY(-2px);box-shadow:0 5px 0 #356f9c}
.navbtn.alt{background:#f0a93b;box-shadow:0 3px 0 #c9871f}
.navbtn.alt:hover{box-shadow:0 5px 0 #c9871f}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔤 發音學習</h1>
  <div class="sub">點卡片開啟對照表（另開新分頁）</div>
  <div class="grid">
    <a class="card" href="https://docs.google.com/spreadsheets/d/1MsSgPeTM_Qvp8QmIb8LR09wcZiQcK90PS-EeDf8gkUw/edit" target="_blank" rel="noopener">
      <div class="cover">ㄅ</div>
      <div class="body"><div class="nm">注音與漢語拼音</div></div>
    </a>
    <a class="card" href="https://docs.google.com/spreadsheets/d/17sLYgxmdUvV2QxFZU6TpTs3YJVaKyW-tF2kwMeb1QNM/edit?gid=0#gid=0" target="_blank" rel="noopener">
      <div class="cover">ㄊ</div>
      <div class="body"><div class="nm">台羅拼音</div></div>
    </a>
    <a class="card" href="https://docs.google.com/spreadsheets/d/1yoAdA2_tTRBbko3He9ZVP6-M8UjPqhc-5WyV2CJ7oaM/edit" target="_blank" rel="noopener">
      <div class="cover">🅰️</div>
      <div class="body"><div class="nm">KK音標與DJ音標</div></div>
    </a>
    <a class="card" href="https://docs.google.com/spreadsheets/d/1jiKrFunaXh_JcN3A09OAZKLkzbz09vUByXnqk2HbSpI/edit" target="_blank" rel="noopener">
      <div class="cover">あ</div>
      <div class="body"><div class="nm">日文羅馬音</div></div>
    </a>
  </div>
  <div class="navbtns">
    <a class="navbtn" href="../">回語言學習區</a>
    <a class="navbtn alt" href="https://sites.google.com/view/zongheziyuanwang/多語言學習區">回多語言學習區</a>
  </div>
</div>
</body>
</html>
